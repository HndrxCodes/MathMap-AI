<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MathMap AI · Diagnostic check</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{--bg:#0e1120;--card:#171b2e;--line:#2a3050;--tx:#e8ebf7;--mut:#8b93b5;--ac:#6c8cff;--ok:#34d399;--mid:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;padding:env(safe-area-inset-top) 14px 96px}
main{max-width:640px;margin:0 auto;padding-top:14px}
h1{font-size:1.4rem;margin:.2rem 0 .3rem}h2{font-size:1.05rem;margin:1.4rem 0 .2rem}
.mut{color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;display:block;width:100%}
button{font:inherit;color:inherit}
.pick{cursor:pointer;text-align:left}.pick.on{border-color:var(--ac);background:#1d2442}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:600}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}.btn:disabled{opacity:.4}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.bar .btn{flex:1}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0}.prog i{display:block;height:100%;background:var(--ac)}
.math{font-size:1.25rem;padding:10px 0 2px;overflow-x:auto;text-align:center}
.opt{display:flex;gap:12px;align-items:center;padding:12px 14px}
.opt b{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;flex:none}
.opt.on b{background:var(--ac);border-color:var(--ac);color:#fff}
.opt .t{overflow-x:auto;white-space:nowrap;min-width:0}
.idk{border-style:dashed;color:var(--mut)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:600}
.strong{background:#12392b;color:var(--ok)}.developing{background:#3d3210;color:var(--mid)}.needs_work{background:#401a1a;color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meter{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}.meter i{display:block;height:100%}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
summary{cursor:pointer;font-weight:600}details .math{font-size:1.1rem}
svg{width:100%;height:auto}
</style></head>
<body><main id="app"></main>
<script>
const SID=new URLSearchParams(location.search).get('student')||localStorage.mm_student||'demo_student';
const NODES={'Operasi Bilangan Bulat':[180,32],'Aljabar Dasar':[180,100],'Faktorisasi':[90,175],'Fungsi':[270,175],'Persamaan Kuadrat':[90,250],'Limit':[270,250]};
const EDGES=[['Operasi Bilangan Bulat','Aljabar Dasar'],['Aljabar Dasar','Faktorisasi'],['Aljabar Dasar','Fungsi'],['Faktorisasi','Persamaan Kuadrat'],['Fungsi','Limit'],['Faktorisasi','Limit']];
const COL={strong:'#34d399',developing:'#fbbf24',needs_work:'#f87171',na:'#4a5275'};
const LBL={strong:'Strong',developing:'Developing',needs_work:'Needs work'};
const app=document.getElementById('app');
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const tex=(el,s,d)=>{if(!el)return;try{katex.render(s,el,{displayMode:!!d,throwOnError:false})}catch(e){el.textContent=s}};
const rich=el=>window.renderMathInElement&&renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
const show=h=>{app.innerHTML=h;scrollTo(0,0)};
async function api(p,b){const r=await fetch('/api'+p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
let S={goal:null,topics:[],concepts:{},review:false};

function goalScreen(){
  const ok=S.goal&&(S.goal==='find_gaps'||S.topics.length);
  const goals=[['test_prep','🎯','Prepare for a test','I have an exam coming up'],['mastery','📘','Master a topic','I want to really understand one topic'],['find_gaps','🔍','Find my gaps',"I'm not sure what I'm missing"]];
  let h='<h1>What brings you here?</h1><p class="mut">Pick one. You do not need to know topic names.</p>'+
    goals.map(g=>`<button class="card pick ${S.goal===g[0]?'on':''}" data-g="${g[0]}"><b>${g[1]} ${g[2]}</b><div class="mut">${g[3]}</div></button>`).join('');
  if(S.goal&&S.goal!=='find_gaps'){
    h+=`<h2>${S.goal==='test_prep'?'Which topics are on the test?':'Which topic?'}</h2><p class="mut">${S.goal==='test_prep'?'Select all that apply.':'Select one.'}</p>`+
      Object.entries(S.concepts).map(([k,v])=>`<button class="card pick ${S.topics.includes(k)?'on':''}" data-t="${esc(k)}"><b>${esc(v.display)}</b><div class="mut">${esc(v.plain.replace(/\^2/g,'²'))}</div></button>`).join('');
  }
  show(h+`<div class="bar"><button class="btn" id="go" ${ok?'':'disabled'}>Start the 10-question check</button></div>`);
}

async function startTest(){
  const s=await api('/baseline/start',{student_id:SID});
  S.sess=s.session_id;S.qs=s.questions;S.i=0;S.review=false;
  S.ans=JSON.parse(localStorage['mm_ans_'+S.sess]||'{}');
  testScreen();
}
function testScreen(){
  const q=S.qs[S.i],n=S.qs.length,a=S.ans[q.id];
  show(`<div class="mut">Question ${S.i+1} of ${n}</div><div class="prog"><i style="width:${(S.i+1)/n*100}%"></i></div>
  <div class="card"><div>${esc(q.stem)}</div><div class="math" id="m"></div></div>`+
  q.options.map((o,k)=>`<button class="card pick opt ${a===k?'on':''}" data-o="${k}"><b>${'ABCDE'[k]}</b><span class="t" id="o${k}"></span></button>`).join('')+
  `<button class="card pick opt idk ${a===null?'on':''}" data-o="-1"><b>?</b><span>I don't know</span></button>
  <div class="bar"><button class="btn ghost" id="prev" ${S.i?'':'disabled'}>Back</button><button class="btn" id="next">${S.i===n-1?'Review':'Next'}</button></div>`);
  tex($('#m'),q.math,true);q.options.forEach((o,k)=>tex($('#o'+k),o));
}
function reviewScreen(){
  const un=S.qs.filter(q=>S.ans[q.id]===undefined).length;
  show(`<h1>Ready to submit?</h1><p class="mut">${un?un+' unanswered. They count as “I don't know”.':'All questions answered.'}</p>
  <div class="dots">`+S.qs.map((q,i)=>`<button class="btn ghost" data-j="${i}" style="${S.ans[q.id]===undefined?'':'border-color:var(--ac)'}">${i+1}</button>`).join('')+
  `</div><div class="bar"><button class="btn ghost" id="prev">Back</button><button class="btn" id="submit">Submit</button></div>`);
}

function resultScreen(){
  const r=S.res,cm={};r.concepts.forEach(c=>cm[c.concept]=c);
  const dn=k=>(S.concepts[k]||{display:k}).display;
  const nodes=Object.entries(NODES).map(([k,[x,y]])=>{const c=cm[k],col=COL[c?c.level:'na'];
    return `<rect x="${x-62}" y="${y-18}" width="124" height="36" rx="10" fill="#171b2e" stroke="${col}" stroke-width="2"/>
    <text x="${x}" y="${y-3}" text-anchor="middle" fill="#e8ebf7" font-size="11" font-weight="600">${esc(dn(k))}</text>
    <text x="${x}" y="${y+11}" text-anchor="middle" fill="${col}" font-size="10">${c?c.correct+'/'+c.total+' correct':'not tested yet'}</text>`}).join('');
  const edges=EDGES.map(([a,b])=>{const [x1,y1]=NODES[a],[x2,y2]=NODES[b];
    return `<line x1="${x1}" y1="${y1+18}" x2="${x2}" y2="${y2-20}" stroke="#4a5275" stroke-width="1.5" marker-end="url(#ar)"/>`}).join('');
  const cards=r.concepts.map(c=>`<div class="card"><div class="row"><b>${esc(c.display)}</b><span class="chip ${c.level}">${LBL[c.level]}</span></div>
    <div class="mut">${c.correct} of ${c.total} correct</div><div class="meter"><i style="width:${c.correct/c.total*100}%;background:${COL[c.level]}"></i></div></div>`).join('');
  const mis=r.misconceptions.length?r.misconceptions.map(m=>`<div class="card"><div class="row"><b>${esc(m.label)}</b><span class="mut">×${m.count}</span></div>
    <div class="mut">${esc(m.description)}</div><div style="margin-top:6px">Root cause to revisit: <b>${esc(m.root_display)}</b></div></div>`).join(''):'<div class="card mut">No specific misconception pattern detected.</div>';
  const rev=r.review.map((q,i)=>`<details class="card"><summary>Q${i+1} ${q.is_correct?'✅':'❌'}</summary><div style="margin-top:8px">${esc(q.stem)}</div><div class="math" id="rm${i}"></div>
    <div class="mut">Your answer</div><div class="t" id="ra${i}">${q.chosen==null?'<i>I don\'t know</i>':''}</div>
    <div class="mut" style="margin-top:6px">Correct answer</div><div id="rc${i}"></div>
    ${q.reason&&!q.is_correct?`<p>${esc(q.reason)}</p>`:''}<p class="mut">${esc(q.solution)}</p></details>`).join('');
  show(`<h1>Your diagnostic</h1><p class="mut">${r.correct} of ${r.total} correct${r.unsure?` · ${r.unsure} marked “I don't know”`:''}. Short checks like this are a starting point; practice sharpens the picture.</p>
  <div class="card"><svg viewBox="0 0 360 275"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5275"/></marker></defs>${edges}${nodes}</svg>
  <div class="mut">Arrows point from a prerequisite to the topic that builds on it.</div></div>
  <h2>By topic</h2>${cards}<h2>Where mistakes come from</h2>${mis}<h2>Review your answers</h2>${rev}
  <div class="bar"><button class="btn ghost" id="retake">Retake</button><button class="btn" id="tutor">Open AI tutor</button></div>`);
  r.review.forEach((q,i)=>{tex($('#rm'+i),q.math,true);if(q.chosen!=null)tex($('#ra'+i),q.options[q.chosen]);tex($('#rc'+i),q.options[q.correct_index])});
  rich(app);
}

app.onclick=async e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  try{
    if(d.g){S.goal=d.g;S.topics=[];return goalScreen()}
    if(d.t){S.topics=S.goal==='test_prep'?(S.topics.includes(d.t)?S.topics.filter(x=>x!==d.t):[...S.topics,d.t]):[d.t];return goalScreen()}
    if(d.o!==undefined){S.ans[S.qs[S.i].id]=d.o==='-1'?null:+d.o;localStorage['mm_ans_'+S.sess]=JSON.stringify(S.ans);return testScreen()}
    if(d.j!==undefined){S.review=false;S.i=+d.j;return testScreen()}
    if(t.id==='go'){t.disabled=true;await api('/goal',{student_id:SID,goal_type:S.goal,topics:S.topics});return startTest()}
    if(t.id==='prev'){if(S.review){S.review=false;S.i=S.qs.length-1}else S.i--;return testScreen()}
    if(t.id==='next'){if(S.i===S.qs.length-1){S.review=true;return reviewScreen()}S.i++;return testScreen()}
    if(t.id==='submit'){t.disabled=true;const a={};S.qs.forEach(q=>a[q.id]=S.ans[q.id]===undefined?null:S.ans[q.id]);
      S.res=await api('/baseline/submit',{session_id:S.sess,answers:a});localStorage.removeItem('mm_ans_'+S.sess);return resultScreen()}
    if(t.id==='retake'){S.goal=null;S.topics=[];return goalScreen()}
    if(t.id==='tutor')location.href='/';
  }catch(err){alert('Something went wrong ('+err.message+'). Please try again.');t.disabled=false}
};

addEventListener('load',async()=>{
  try{S.concepts=await api('/concepts');
    const r=await api('/baseline/result/'+SID);if(r&&r.total){S.res=r;return resultScreen()}
  }catch(e){}
  goalScreen();
});
</script></body></html>
