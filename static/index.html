<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>MathMap AI</title>
<script>
window.onerror=function(m,u,l){var d=document.createElement('pre');d.style.cssText='color:#f87171;white-space:pre-wrap;padding:12px';d.textContent='JS error: '+m+' (line '+l+')';document.body.prepend(d)};
setTimeout(function(){var a=document.getElementById('app');if(a&&!a.innerHTML.trim()){var d=document.createElement('pre');d.style.cssText='color:#fbbf24;white-space:pre-wrap;padding:12px';d.textContent='Page loaded (build 5) but nothing rendered yet.';document.body.prepend(d)}},3000);
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js" onload="window.flush&&flush()"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js" onload="window.flush&&flush()"></script>
<style>
:root{color-scheme:dark;--bg:#0e1120;--card:#171b2e;--line:#2a3050;--tx:#e8ebf7;--mut:#8b93b5;--ac:#60a5fa;--acbg:rgba(96,165,250,.12);--ok:#34d399;--mid:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;padding:env(safe-area-inset-top) 14px 96px}
main{max-width:640px;margin:0 auto;padding-top:14px}
h1{font-size:1.4rem;margin:.2rem 0 .3rem}h2{font-size:1.05rem;margin:1.4rem 0 .2rem}
.mut{color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;display:block;width:100%}
button{font:inherit;color:inherit}
.pick{cursor:pointer;text-align:left}.pick.on{border-color:var(--ac);background:var(--acbg)}
.btn{background:var(--ac);color:#0b1220;border:0;border-radius:12px;padding:12px 18px;font-weight:700}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx);font-weight:500}.btn:disabled{opacity:.4}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.bar .btn{flex:1}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0}.prog i{display:block;height:100%;background:var(--ac)}
.math{font-size:1.25rem;padding:10px 0 2px;overflow-x:auto;text-align:center}
.opt{display:flex;gap:12px;align-items:center;padding:12px 14px}
.opt b{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;flex:none}
.opt.on b{background:var(--ac);border-color:var(--ac);color:#0b1220}
.opt .t{overflow-x:auto;white-space:nowrap;min-width:0}
.idk{border-style:dashed;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 16px}.pill.on{border-color:var(--ac);background:var(--acbg);color:var(--ac);font-weight:600}
.tag{font-size:.72rem;padding:1px 9px;border-radius:99px;border:1px solid rgba(96,165,250,.4);background:var(--acbg);color:var(--ac);margin-left:6px;font-weight:600;white-space:nowrap}
.tag.go{background:var(--ac);color:#0b1220;border-color:var(--ac)}
.hero{display:flex;gap:16px;align-items:center}.hero svg{flex:none}
.leg{display:grid;gap:4px;font-size:.9rem}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.step{display:flex;gap:12px}
.rail{width:14px;display:flex;flex-direction:column;align-items:center}
.rail i{width:12px;height:12px;border-radius:50%;margin-top:7px;flex:none}
.step:not(:last-child) .rail::after{content:"";flex:1;width:2px;background:var(--line);margin-top:4px}
.sbody{flex:1;padding-bottom:14px;min-width:0}
code,.hl{color:var(--ac);background:var(--acbg);border-radius:6px;padding:0 6px}
summary{cursor:pointer;font-weight:600}details .math{font-size:1.1rem}
</style></head>
<body><main id="app"></main>
<script>
const SID=new URLSearchParams(location.search).get('student')||localStorage.mm_student||'demo_student';
const COL={strong:'#34d399',developing:'#fbbf24',needs_work:'#f87171',untested:'#4a5275'};
const LBL={strong:'Strong',developing:'Developing',needs_work:'Needs work'};
const app=document.getElementById('app');
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pend=[];
const tex=(el,s,d)=>{if(!el)return;if(window.katex){try{katex.render(s,el,{displayMode:!!d,throwOnError:false})}catch(e){el.textContent=s}}else{el.textContent=s;pend.push([el,s,d])}};
const rich=el=>window.renderMathInElement&&renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
window.flush=()=>{while(pend.length){const p=pend.shift();tex(p[0],p[1],p[2])}rich(app)};
const show=h=>{app.innerHTML=h;scrollTo(0,0)};
async function api(p,b){const r=await fetch('/api'+p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
let S={goal:null,exam:null,topics:[],minutes:20,concepts:{},exams:{},review:false,ready:[]};

const ready=()=>!!S.goal&&(S.goal==='find_gaps'||(S.goal==='mastery'&&S.topics.length===1)||(S.goal==='test_prep'&&S.exam&&(S.exam!=='school'||S.topics.length>0)));
const topicList=()=>{
  let list=Object.entries(S.concepts);
  const only=S.goal==='mastery'&&S.ready.length;
  if(only)list=list.filter(([k])=>S.ready.includes(k));
  return list.map(([k,v])=>`<button class="card pick ${S.topics.includes(k)?'on':''}" data-t="${esc(k)}"><b>${esc(v.display)}</b><div class="mut">${esc(v.plain.replace(/\^2/g,'²'))}</div></button>`).join('')+(only?'<p class="mut">More topics are coming soon.</p>':'');
};
  
function goalScreen(){
  const G=[['test_prep','🎯','Prepare for a test','Practice for SAT, CSCA or your own exam'],['mastery','📘','Master a topic','Go deep on one topic and check the skills it builds on'],['find_gaps','🔍','Find my gaps','A broad scan of the basics to see where to start']];
  let h='<h1>What brings you here?</h1><p class="mut">Pick one. You do not need to know topic names.</p>'+
    G.map(g=>`<button class="card pick ${S.goal===g[0]?'on':''}" data-g="${g[0]}"><b>${g[1]} ${g[2]}</b><div class="mut">${g[3]}</div></button>`).join('');
  if(S.goal==='test_prep'){
    h+='<h2>Which test?</h2>'+Object.entries(S.exams).map(([k,e])=>`<button class="card pick ${S.exam===k?'on':''}" data-e="${k}"><b>${esc(e.name)}</b><div class="mut">${esc(e.facts)}</div>${e.covers.length?`<div class="mut" style="margin-top:6px">Covered here: ${esc(e.covers.join(', '))}</div><div class="mut">Not covered yet: ${esc(e.gaps.join(', '))}</div>`:''}</button>`).join('');
    if(S.exam==='school')h+='<h2>Which topics are on it?</h2><p class="mut">Select all that apply.</p>'+topicList();
  }
  if(S.goal==='mastery')h+='<h2>Which topic?</h2>'+topicList();
  if(ready())h+='<h2>Daily study time</h2><p class="mut">How much can you realistically study each day?</p><div class="pills">'+[10,20,30,45].map(m=>`<button class="pill ${S.minutes===m?'on':''}" data-m="${m}">${m} min</button>`).join('')+'</div>';
  show(h+`<p class="mut" style="text-align:center;font-size:.7rem;margin-top:24px">build 5</p><div class="bar"><button class="btn" id="go" ${ready()?'':'disabled'}>Start the 10-question check</button></div>`);
}

async function startTest(){
  const s=await api('/baseline/start',{student_id:SID,mode:S.start.mode,topics:S.start.topics});
  S.sess=s.session_id;S.qs=s.questions;S.i=0;S.review=false;
  S.ans=JSON.parse(localStorage['mm_ans_'+S.sess]||'{}');
  testScreen();
}
function testScreen(){
  const q=S.qs[S.i],n=S.qs.length,a=S.ans[q.id];
  show(`<div class="mut">Question ${S.i+1} of ${n}</div><div class="prog"><i style="width:${(S.i+1)/n*100}%"></i></div>
  <div class="card"><div>${esc(q.stem)}</div><div class="math" id="m"></div></div>`+
  q.options.map((o,k)=>`<button class="card pick opt ${a===k?'on':''}" data-o="${k}"><b>${'ABCDE'[k]}</b><span class="t" id="o${k}"></span></button>`).join('')+
  `<button class="card pick opt idk ${a===null?'on':''}" data-o="-1"><b>?</b><span>I don't know</span></button>
  <div class="bar"><button class="btn ghost" id="prev" ${S.i?'':'disabled'}>Back</button><button class="btn" id="next">${S.i===n-1?'Review':'Next'}</button></div>`);
  tex($('#m'),q.math,true);q.options.forEach((o,k)=>tex($('#o'+k),o));
}
function reviewScreen(){
  const un=S.qs.filter(q=>S.ans[q.id]===undefined).length;
  show(`<h1>Ready to submit?</h1><p class="mut">${un?`${un} unanswered. They count as “I don't know”.`:'All questions answered.'}</p>
  <div class="dots">`+S.qs.map((q,i)=>`<button class="btn ghost" data-j="${i}" style="${S.ans[q.id]===undefined?'':'border-color:var(--ac)'}">${i+1}</button>`).join('')+
  `</div><div class="bar"><button class="btn ghost" id="prev">Back</button><button class="btn" id="submit">Submit</button></div>`);
}

function donut(c,w,u,t){
  const R=42,C=2*Math.PI*R;let off=0;
  const seg=(n,col)=>{const l=n/t*C,s=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${col}" stroke-width="14" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=l;return s};
  return `<svg viewBox="0 0 120 120" width="120" height="120"><circle r="${R}" cx="60" cy="60" fill="none" stroke="#2a3050" stroke-width="14"/>${seg(c,'#60a5fa')}${seg(w,'#f87171')}${seg(u,'#6b7394')}<text x="60" y="67" text-anchor="middle" fill="#e8ebf7" font-size="22" font-weight="700">${c}/${t}</text></svg>`;
}

function resultScreen(){
  const r=S.res,g=r.goal||{},wrong=r.total-r.correct-r.unsure;
  const dn=k=>(S.concepts[k]||{display:k}).display;
  const title=r.mode==='topic'?`Path to ${esc(dn(r.topics[0]))}`:r.mode==='exam'?'Path to your test':'Your learning path';
  const path=r.path.map(n=>`<div class="step"><div class="rail"><i style="background:${COL[n.status]}"></i></div><div class="sbody"><div class="row"><b>${esc(n.display)}</b><span>${n.goal?'<span class="tag">Goal</span>':''}${n.concept===r.start_concept?'<span class="tag go">Start here</span>':''}</span></div><div class="mut">${n.total?`${n.correct} of ${n.total} correct · ${LBL[n.status]}`:'Not tested in this check'}</div></div></div>`).join('');
  const next=r.start_concept?`Start with <span class="hl">${esc(dn(r.start_concept))}</span>${g.study_minutes?` · ${g.study_minutes} min a day`:''}.`:'You look ready for this goal. Move on to harder practice.';
  const mis=r.misconceptions.length?r.misconceptions.map(m=>`<div class="card"><div class="row"><b>${esc(m.label)}</b><span class="mut">×${m.count}</span></div>
    <div class="mut">${esc(m.description)}</div><div style="margin-top:6px">Root cause to revisit: <span class="hl">${esc(m.root_display)}</span></div></div>`).join(''):'<div class="card mut">No specific misconception pattern detected.</div>';
  const rev=r.review.map((q,i)=>`<details class="card"><summary>Q${i+1} ${q.is_correct?'✅':'❌'}</summary><div style="margin-top:8px">${esc(q.stem)}</div><div class="math" id="rm${i}"></div>
    <div class="mut">Your answer</div><div class="t" id="ra${i}">${q.chosen==null?'<i>I don\'t know</i>':''}</div>
    <div class="mut" style="margin-top:6px">Correct answer</div><div id="rc${i}"></div>
    ${q.reason&&!q.is_correct?`<p>${esc(q.reason)}</p>`:''}<p class="mut">${esc(q.solution)}</p></details>`).join('');
  show(`<h1>Your diagnostic</h1>
  <div class="card hero">${donut(r.correct,wrong,r.unsure,r.total)}<div class="leg"><div><i style="background:#60a5fa"></i>${r.correct} correct</div><div><i style="background:#f87171"></i>${wrong} not quite</div><div><i style="background:#6b7394"></i>${r.unsure} unsure</div></div></div>
  <p class="mut">A short check is a starting point. Practice sharpens the picture.</p>
  <h2>${title}</h2><p>${next}</p><div class="card">${path}</div>
  <h2>Where mistakes come from</h2>${mis}<h2>Review your answers</h2>${rev}
  <div class="bar"><button class="btn ghost" id="retake">Retake</button><button class="btn" id="tutor">Open AI tutor</button></div>`);
  r.review.forEach((q,i)=>{tex($('#rm'+i),q.math,true);if(q.chosen!=null)tex($('#ra'+i),q.options[q.chosen]);tex($('#rc'+i),q.options[q.correct_index])});
  rich(app);
}

app.onclick=async e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  try{
    if(d.g){S.goal=d.g;S.exam=null;S.topics=[];return goalScreen()}
    if(d.e){S.exam=d.e;S.topics=[];return goalScreen()}
    if(d.t){S.topics=S.goal==='test_prep'?(S.topics.includes(d.t)?S.topics.filter(x=>x!==d.t):[...S.topics,d.t]):[d.t];return goalScreen()}
    if(d.m){S.minutes=+d.m;return goalScreen()}
    if(d.o!==undefined){S.ans[S.qs[S.i].id]=d.o==='-1'?null:+d.o;localStorage['mm_ans_'+S.sess]=JSON.stringify(S.ans);return testScreen()}
    if(d.j!==undefined){S.review=false;S.i=+d.j;return testScreen()}
    if(t.id==='go'){t.disabled=true;
      const mode=S.goal==='mastery'?'topic':S.goal==='test_prep'?'exam':'gaps';
      const topics=S.goal==='test_prep'&&S.exam!=='school'?S.exams[S.exam].topics:S.topics;
      S.start={mode,topics};
      await api('/goal',{student_id:SID,goal_type:S.goal,topics,study_minutes:S.minutes,exam:S.exam||''});
      return startTest()}
    if(t.id==='prev'){if(S.review){S.review=false;S.i=S.qs.length-1}else S.i--;return testScreen()}
    if(t.id==='next'){if(S.i===S.qs.length-1){S.review=true;return reviewScreen()}S.i++;return testScreen()}
    if(t.id==='submit'){t.disabled=true;const a={};S.qs.forEach(q=>a[q.id]=S.ans[q.id]===undefined?null:S.ans[q.id]);
      S.res=await api('/baseline/submit',{session_id:S.sess,answers:a});localStorage.removeItem('mm_ans_'+S.sess);return resultScreen()}
    if(t.id==='retake'){S.goal=null;S.exam=null;S.topics=[];return goalScreen()}
    if(t.id==='tutor')location.href='/tutor.html';
  }catch(err){alert('Something went wrong ('+err.message+'). Please try again.');t.disabled=false}
};

(async()=>{
  try{S.concepts=await api('/concepts');S.exams=await api('/exams');S.ready=await api('/topics/ready').catch(()=>[])}catch(e){return show(`<h1>Cannot load the app data</h1><p class="mut">${esc(e.message)}. The server may be restarting, or the /api routes are not connected.</p>`)}
  try{const r=await api('/baseline/result/'+SID);if(r&&r.total){S.res=r;return resultScreen()}}catch(e){}
  goalScreen();
})();
</script></body></html>
